{% extends 'base.html' %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>{{ object|yesno:"Update,Create" }} tag</h1>
  <form action="" method="POST" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    {% if object %}
      <input class="btn btn-primary mt-3" type="submit" value="Update">
    {% else %}
      <input class="btn btn-primary mt-3" type="submit" value="Create">
    {% endif %}
  </form>
  <a class="btn btn-secondary mt-3" href="{% url 'todo_list:tag_list' %}">Cancel</a>
{% endblock %}
